<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff946b" />
    <meta
      name="description"
      content="An atmospheric, interactive Hawaiian sunset island built with Three.js and Cannon-es."
    />
    <title>Golden Hour — Hawaiian Island</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

      :root {
        color-scheme: light;
        font-family: 'DM Sans', sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #ff946b; }
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(22px, 4vw, 52px);
        pointer-events: none;
        color: #fff3e1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        padding: 9px 16px 9px 9px;
        border: 1px solid rgb(255 246 230 / 24%);
        border-radius: 999px;
        background: rgb(43 39 61 / 18%);
        box-shadow: 0 10px 36px rgb(52 35 48 / 10%);
        backdrop-filter: blur(14px);
      }
      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgb(255 246 230 / 32%);
        border-radius: 50%;
        font-size: 19px;
      }
      .brand-name { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .hero {
        max-width: 460px;
        margin: auto 0;
        padding: 22px 26px 26px;
        transform: translate(-26px, -4vh);
        border: 1px solid rgb(255 246 230 / 15%);
        border-radius: 24px;
        background: linear-gradient(110deg, rgb(55 38 55 / 26%), rgb(55 38 55 / 7%));
        box-shadow: 0 18px 70px rgb(52 35 48 / 10%);
        backdrop-filter: blur(7px);
      }
      .eyebrow {
        margin: 0 0 14px;
        color: #ffe0af;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(60px, 9.2vw, 116px);
        font-weight: 600;
        letter-spacing: -.055em;
        line-height: .88;
        text-shadow: 0 6px 44px rgb(88 42 57 / 18%);
      }
      .intro {
        max-width: 330px;
        margin: 22px 0 0;
        color: rgb(255 243 225 / 86%);
        font-size: 15px;
        line-height: 1.7;
        text-shadow: 0 2px 14px rgb(61 37 51 / 25%);
      }
      .bottom-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      .hint {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 16px;
        border: 1px solid rgb(255 245 225 / 30%);
        border-radius: 999px;
        background: rgb(48 43 63 / 24%);
        color: #fff3e1;
        font-size: 12px;
        box-shadow: 0 8px 34px rgb(52 35 48 / 12%);
        backdrop-filter: blur(14px);
      }
      .hint-icon { font-size: 18px; }
      .credit { color: rgb(255 243 225 / 75%); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      .lil-gui {
        z-index: 3 !important;
        --width: 260px;
        --font-family: 'DM Sans', sans-serif;
        --font-size: 11px;
        --widget-color: rgb(255 246 230 / 13%);
        --hover-color: rgb(255 246 230 / 23%);
        --focus-color: #ef9c72;
        --number-color: #ffd0a2;
        --string-color: #ffd0a2;
        color: #fff3e1;
      }
      .lil-gui.root { border: 1px solid rgb(255 245 225 / 22%); border-radius: 12px; overflow: hidden; }
      .lil-gui .title { background: rgb(51 40 56 / 82%); }
      .lil-gui .children { background: rgb(43 39 61 / 78%); backdrop-filter: blur(16px); }

      @media (max-width: 600px) {
        .hero { transform: translate(-22px, -2vh); padding: 18px 20px 20px; }
        .intro { max-width: 270px; font-size: 13px; }
        .credit { display: none; }
        .hint { max-width: calc(100vw - 44px); font-size: 11px; }
        .lil-gui { --width: 225px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main class="overlay" aria-label="Interactive tropical island">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span class="brand-name">Hawaiian Islands · 19° N</span>
      </header>
      <section class="hero">
        <p class="eyebrow">The last light of the day</p>
        <h1>Golden<br />hour.</h1>
        <p class="intro">A warm breeze, a quiet shore, and the sun slipping into the Pacific. Take a moment, then send a little something out to sea.</p>
      </section>
      <footer class="bottom-row">
        <div class="hint"><span class="hint-icon" aria-hidden="true">☼</span><span>Click the island or ocean to toss a coconut or beach ball</span></div>
        <span class="credit">Hawaiian sunset · Pacific Ocean</span>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
